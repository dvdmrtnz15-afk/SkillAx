name: validate
on:
  push:
  pull_request:
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate.py --all
      - run: python3 scripts/rank_test.py
      - run: python3 scripts/measure.py packs/skillax --expect PASS
      - run: python3 skills/sentinel-audit-lane/scripts/test_scan.py
      - run: python3 scripts/geocanon_validate.py fixtures/geocanon/little-village-starbucks.reference.json
      - run: python3 scripts/geocanon_test.py
      - run: python3 -m json.tool spec/geocanon/geocanon-runtime.schema.json >/dev/null
      - run: python3 scripts/geocanon_runtime_test.py
      - run: >-
          python3 scripts/geocanon_runtime.py run
          fixtures/geocanon/runtime/reference.bundle.json
          fixtures/geocanon/runtime/reference.request.json
          --output /tmp/geocanon-runtime-output.ppm
          --result-out /tmp/geocanon-runtime-result.json
      - run: >-
          python3 scripts/geocanon_runtime.py validate-result
          fixtures/geocanon/runtime/reference.bundle.json
          fixtures/geocanon/runtime/reference.request.json
          /tmp/geocanon-runtime-result.json
          /tmp/geocanon-runtime-output.ppm
