name: sentinel
on:
  workflow_call:
    inputs:
      engine_sha:
        description: Immutable SkillAx commit SHA
        required: true
        type: string
      policy_path:
        description: Policy profile path in the calling repo
        required: false
        default: .sentinel/policy.yml
        type: string
  workflow_dispatch:
    inputs:
      engine_sha:
        description: Immutable SkillAx commit SHA
        required: true
        type: string
      policy_path:
        description: Policy profile path
        required: false
        default: .sentinel/policy.yml
        type: string

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4
      - name: Checkout pinned Sentinel engine
        uses: actions/checkout@v4
        with:
          repository: dvdmrtnz15-afk/SkillAx
          ref: ${{ inputs.engine_sha }}
          path: .sentinel/engine
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan
        run: |
          python3 .sentinel/engine/skills/sentinel-audit-lane/scripts/scan.py \
            --root . \
            --policy "${{ inputs.policy_path }}" \
            --out .sentinel/receipts/latest.json \
            --delivery-id "${GITHUB_RUN_ID}-${GITHUB_SHA}"
      - name: Fail closed on authority
        run: |
          python3 .sentinel/engine/skills/sentinel-audit-lane/scripts/scan.py \
            --assert-no-authority .sentinel/receipts/latest.json
      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-receipt
          path: .sentinel/receipts/latest.json
